description = "Telegram support bot for organized group feedback"
requires-python = ">=3.14,<3.15"
dependencies = [
    "aiogram>=3.30.0",
    "aiogram-newsletter>=0.0.12",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "cachetools>=7.1.7",
    "environs>=15.1.0",
    "pydantic>=2.13.4",
    "redis>=8.1.0",
    "setuptools<82",
    "sqlalchemy>=2.0",
]
