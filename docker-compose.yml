services:

  bot:
    image: ghcr.io/vadimkholodilo/support-bot:latest
    build:
      context: .
    container_name: support-bot
    restart: always
    depends_on:
      - redis
    volumes:
      - .:/usr/src/app
    networks:
      - network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    container_name: support-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-support_bot}
      POSTGRES_USER: ${POSTGRES_USER:-support_bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-support_bot}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - network
    logging:
      driver: json-file
      options:
        max-size: "1m"
        max-file: "3"

  redis:
    image: redis:alpine
    container_name: support-redis
    restart: always
    volumes:
      - redis-data:/data
    networks:
      - network


networks:
  network:

volumes:
  postgres-data:
  redis-data:
